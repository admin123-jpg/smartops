# ============================================================
# SmartOps Assistant —— 一键起整套
#
#   docker compose up -d --build        启动（首次会自动构建镜像）
#   docker compose logs -f app worker   看日志
#   docker compose down                 停止（数据保留在卷里）
#   docker compose down -v              停止并清空数据
#
# 访问：http://localhost  （经 Nginx）  或  http://localhost:8100  （直连应用）
# ============================================================
name: smartops

# 应用与 worker/beat 共用同一套环境变量，抽出来避免三处重复
x-app-env: &app-env
  HOST: 0.0.0.0
  PORT: "8100"
  DEBUG: "false"
  # 容器之间用服务名互相寻址（Docker 内置 DNS），不要写 127.0.0.1
  # 默认 SQLite：开箱即用、零依赖。生产换 MySQL 见 README「切到 MySQL」。
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/smartops.db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  SSH_TIMEOUT: "10"
  SSH_MAX_CONCURRENCY: "10"
  INSPECT_DISK_WARN: "80"
  INSPECT_MEM_WARN: "85"
  # 大模型：留空则 AI 诊断自动降级为内置规则库（mode 字段会标明来源）
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}

services:
  # ---------------- 队列中间件 ----------------
  redis:
    image: redis:7-alpine
    container_name: smartops-redis
    # appendonly 开 AOF：worker 崩了重启，队列里的任务不丢
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [smartops]

  # ---------------- 业务数据库（可选）----------------
  # 默认不启动 —— compose 开箱即用走 SQLite，一条命令就能起。
  # 要用 MySQL：在 .env 里把 DATABASE_URL 指向它，然后
  #   docker compose --profile mysql up -d
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: smartops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smartops
      MYSQL_USER: smartops
      MYSQL_PASSWORD: smartops123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [smartops]

  # ---------------- Web 服务 ----------------
  app:
    build: .
    image: smartops-assistant:0.1.0
    container_name: smartops-app
    environment: *app-env
    volumes:
      - app-data:/app/data          # SQLite 库与巡检报告，重建容器不丢
    depends_on:
      redis: { condition: service_healthy }
    # 故意不写 mysql：默认走 SQLite，强制等 MySQL 会让「开箱即用」跑不起来。
    ports:
      - "8100:8100"
    restart: unless-stopped
    networks: [smartops]

  # ---------------- 后台工人 ----------------
  # 批量执行 / 巡检真正干活的地方，跟 app 拆开才能「Web 立刻返回、任务后台跑」
  worker:
    build: .
    image: smartops-assistant:0.1.0
    container_name: smartops-worker
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - -l
      - info
      - --concurrency=4
    environment: *app-env
    volumes:
      - app-data:/app/data          # 报告要写在这里，否则 app 读不到 worker 生成的文件
    # ★ 必须覆盖镜像里的 HEALTHCHECK：镜像那个探的是 8100 的 HTTP 接口，
    #   而 worker 根本不监听端口 —— 不覆盖就会永远显示 unhealthy。
    #   worker 的正确探法是问 Celery 自己：能不能 ping 到这个节点。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      redis: { condition: service_healthy }
    # 同上：不依赖 mysql，默认 SQLite
    restart: unless-stopped
    networks: [smartops]

  # ---------------- 定时调度 ----------------
  # 每 6 小时自动巡检一次（调度表定义在 app/tasks/celery_app.py 的 beat_schedule）
  beat:
    build: .
    image: smartops-assistant:0.1.0
    container_name: smartops-beat
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - beat
      - -l
      - info
    environment: *app-env
    volumes:
      - app-data:/app/data
    # beat 只是个调度器，不监听端口、也没有可探测的「就绪」信号，
    # 镜像里的 HTTP 探针在它身上必然失败 —— 关掉比假装健康更诚实。
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [smartops]

  # ---------------- 反向代理 ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: smartops-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped
    networks: [smartops]

volumes:
  redis-data:
  mysql-data:
  app-data:

networks:
  smartops:
    driver: bridge
