# SmartOps Assistant —— Nginx 反向代理
# 挂载到容器的 /etc/nginx/conf.d/default.conf

upstream smartops_app {
    # 服务名由 Docker 内置 DNS 解析；下面这行是「容器重建后自动感知新 IP」的关键
    server app:8100;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 日志分析支持上传日志文件，别让默认 1m 卡住大文件
    client_max_body_size 50m;

    location / {
        proxy_pass http://smartops_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- WebSocket 升级 ----------
        # 批量执行靠 WebSocket 把每台机器的结果实时推给前端。
        # 少了 Upgrade / Connection 这两行，握手会失败（前端报 400/426），
        # 页面上表现成「任务在跑但结果一直不出现」—— 这是最容易漏的一处配置。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 批量执行 50 台、全量巡检都可能跑几分钟，网关别提前掐断
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
